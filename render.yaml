# Render Blueprint: one Docker web service. Render injects $PORT; the Dockerfile CMD honors it.
services:
  - type: web
    name: churn-inference-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render sits behind Cloudflare, which overwrites this header with the visitor's IP,
      # so clients cannot fake it. The rate limiter counts requests per this IP.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
